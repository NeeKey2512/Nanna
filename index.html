<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>For Nanna ❤️</title>

<style>

body{
    margin:0;
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:linear-gradient(135deg,#ff758c,#ff7eb3,#ffc3a0);
    font-family: 'Segoe UI', cursive;
    overflow:hidden;
}

/* Glass Card */
.card{
    backdrop-filter: blur(15px);
    background: rgba(255,255,255,0.15);
    border:1px solid rgba(255,255,255,0.3);
    padding:45px;
    border-radius:30px;
    text-align:center;
    width:350px;
    color:white;
    box-shadow:0 0 40px rgba(255,255,255,0.4);
}

/* Title */
h1{
    font-size:30px;
    margin-bottom:20px;
}

/* Typewriter text */
#text{
    font-size:22px;
    min-height:90px;
    line-height:1.7;
}

/* Button */
button{
    margin-top:20px;
    padding:12px 24px;
    border:none;
    border-radius:25px;
    background:white;
    color:#ff4d6d;
    font-weight:bold;
    cursor:pointer;
    transition:0.3s;
}

button:hover{
    transform:scale(1.1);
    box-shadow:0 0 15px white;
}

/* Hidden Message */
#loveMsg{
    display:none;
    margin-top:20px;
    font-size:20px;
    animation:fade 1s ease;
}

@keyframes fade{
    from{opacity:0; transform:translateY(10px);}
    to{opacity:1; transform:translateY(0);}
}

/* Floating hearts */
.heart{
    position:absolute;
    bottom:-10px;
    color:white;
    animation:float 6s linear infinite;
    opacity:0.8;
}

@keyframes float{
    0%{transform:translateY(0) scale(1);}
    100%{transform:translateY(-110vh) scale(1.5);}
}

</style>
</head>

<body>

<div class="card">
    <h1>Happy Valentine's Day Nanna ❤️</h1>

    <div id="text"></div>

    <button onclick="showLove()">Open My Heart 💌</button>

    <div id="loveMsg">
        You are my today, tomorrow and forever 💖
    </div>
</div>

<script>

/* TYPEWRITER MESSAGE */
const message = [
"I love you 😘",
"I miss you 🥺",
"You make this day special 💕"
];

let line=0, char=0;

function typeWriter(){
    if(line < message.length){
        if(char < message[line].length){
            document.getElementById("text").innerHTML += message[line].charAt(char);
            char++;
            setTimeout(typeWriter,50);
        }else{
            document.getElementById("text").innerHTML += "<br>";
            line++; char=0;
            setTimeout(typeWriter,500);
        }
    }
}
typeWriter();

/* BUTTON MESSAGE */
function showLove(){
    document.getElementById("loveMsg").style.display="block";
}

/* FLOATING HEARTS */
function createHeart(){
    const heart=document.createElement("div");
    heart.className="heart";
    heart.innerHTML="❤";
    heart.style.left=Math.random()*100+"vw";
    heart.style.fontSize=(Math.random()*20+10)+"px";
    document.body.appendChild(heart);
    setTimeout(()=>heart.remove(),6000);
}
setInterval(createHeart,300);

</script>

</body>
</html>
