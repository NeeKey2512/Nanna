<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>For Nanna ❤️</title>

<style>
    body{
        margin:0;
        height:100vh;
        display:flex;
        justify-content:center;
        align-items:center;
        background: linear-gradient(135deg,#ff6a88,#ff99ac);
        font-family: 'Segoe UI', cursive;
        overflow:hidden;
    }

    /* Floating Hearts */
    .heart{
        position:absolute;
        color:#ff2e63;
        animation: fall linear infinite;
    }

    @keyframes fall{
        0%{transform:translateY(-10vh);}
        100%{transform:translateY(110vh);}
    }

    .card{
        background:white;
        padding:40px;
        border-radius:25px;
        text-align:center;
        width:340px;
        box-shadow:0 10px 40px rgba(0,0,0,0.25);
    }

    h1{
        color:#ff2e63;
        margin-bottom:10px;
    }

    .msg{
        font-size:22px;
        color:#444;
        line-height:1.7;
        margin-top:15px;
    }

    button{
        margin-top:20px;
        padding:12px 20px;
        border:none;
        border-radius:20px;
        background:#ff2e63;
        color:white;
        font-size:16px;
        cursor:pointer;
        transition:0.3s;
    }

    button:hover{
        background:#ff4f7d;
        transform:scale(1.05);
    }

    .hidden{
        display:none;
        margin-top:15px;
        font-size:20px;
        color:#ff2e63;
        animation: fade 1s ease;
    }

    @keyframes fade{
        from{opacity:0; transform:translateY(10px);}
        to{opacity:1; transform:translateY(0);}
    }
</style>
</head>

<body>

<div class="card">
    <h1>Happy Valentine's Day Nanna ❤️</h1>

    <div class="msg">
        I love you 😘 <br>
        I miss you 🥺 <br><br>
        You make this day special 💕
    </div>

    <button onclick="showLove()">Click Here 💌</button>

    <div id="loveMsg" class="hidden">
        You are my favorite person forever ❤️
    </div>
</div>

<script>
    function showLove(){
        document.getElementById("loveMsg").style.display="block";
    }

    // Falling hearts generator
